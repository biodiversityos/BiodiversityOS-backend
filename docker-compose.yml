services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1
      # first and the servers bind IPv4 only, so the check fails on a
      # perfectly healthy container.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
